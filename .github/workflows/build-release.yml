name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Optional existing tag to attach APK (e.g. v1.6.4). Leave empty for artifact only.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Ensure Android platform files exist
        working-directory: flutter_app
        run: |
          if [ ! -d android ]; then
            echo "android/ missing — generating platform folders"
            flutter create . --project-name order_flow --org com.orderflow --platforms=android
          fi
          if [ -f android/app/src/main/AndroidManifest.xml ]; then
            sed -i 's/<application /<application android:usesCleartextTraffic="true" /' android/app/src/main/AndroidManifest.xml || true
          fi
          if [ -f android/app/build.gradle ]; then
            sed -i -E 's/minSdk(Version)?[[:space:]]*=?[[:space:]]*[0-9]+/minSdkVersion 23/' android/app/build.gradle || true
            sed -i -E 's/compileSdk(Version)?[[:space:]]*=?[[:space:]]*[0-9]+/compileSdkVersion 34/' android/app/build.gradle || true
          fi
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/minSdk = .*/minSdk = 23/' android/app/build.gradle.kts || true
            sed -i 's/compileSdk = .*/compileSdk = 34/' android/app/build.gradle.kts || true
          fi

      - name: Gradle memory settings
        working-directory: flutter_app
        run: |
          mkdir -p android
          cat >> android/gradle.properties << 'PROPS'

          org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
          org.gradle.daemon=false
          org.gradle.parallel=false
          org.gradle.workers.max=2
          PROPS

      - name: Install dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Patch plugin Android namespaces & compileSdk
        working-directory: flutter_app
        run: |
          for f in $(find "$HOME/.pub-cache/hosted/pub.dev" -path "*/android/build.gradle" 2>/dev/null); do
            if ! grep -q "namespace" "$f" 2>/dev/null; then
              MANIFEST="$(dirname "$f")/src/main/AndroidManifest.xml"
              PKG=""
              if [ -f "$MANIFEST" ]; then
                PKG=$(grep -oP 'package="\K[^"]+' "$MANIFEST" | head -1 || true)
              fi
              if [ -n "$PKG" ]; then
                sed -i "/android {/a\\    namespace \"$PKG\"" "$f" || true
                echo "Patched namespace $PKG -> $f"
              fi
            fi
            if grep -qE 'compileSdk(Version)?[[:space:]]+[0-9]+' "$f" 2>/dev/null; then
              sed -i -E 's/compileSdk(Version)?[[:space:]]+[0-9]+/compileSdkVersion 34/' "$f" || true
            fi
          done

      - name: Code generation (optional)
        working-directory: flutter_app
        run: |
          if grep -q "build_runner" pubspec.yaml; then
            dart run build_runner build --delete-conflicting-outputs || true
          fi

      - name: Analyze (non-blocking)
        working-directory: flutter_app
        run: dart analyze lib || true

      - name: Build release APK
        working-directory: flutter_app
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: order-flow-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Attach APK to GitHub Release (tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attach APK to existing release (manual run with tag)
        if: github.event_name == 'workflow_dispatch' && inputs.tag_name != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          files: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
