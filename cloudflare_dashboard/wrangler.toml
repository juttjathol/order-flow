name = "order-flow-dashboard"
main = "workers/index.js"
compatibility_date = "2024-09-01"

[[d1_databases]]
binding = "DB"
database_name = "order-flow-db"
database_id = "YOUR_D1_DATABASE_ID_HERE"

[vars]
ADMIN_EMAIL = "admin@example.com"
GITHUB_REPO = "juttjathol/order-flow"

# For Cloudflare Pages connected to GitHub:
# Build output directory = cloudflare_dashboard/public
# Framework preset = None
# After connect, bind D1 database as DB and set JWT_SECRET
