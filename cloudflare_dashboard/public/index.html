<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Order Flow · Seller Dashboard</title>
  <style>
    :root { --bg:#0b1220; --card:#1a2332; --border:#2d3a4f; --text:#f1f5f9; --muted:#94a3b8; --accent:#38bdf8; --teal:#2dd4bf; --ok:#4ade80; --danger:#f87171; --radius:14px; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Segoe UI", system-ui, sans-serif; background: radial-gradient(1000px 500px at 0% 0%, #0c4a6e44, transparent), radial-gradient(800px 400px at 100% 0%, #134e4a33, transparent), var(--bg); color: var(--text); min-height: 100vh; line-height: 1.5; }
    .container { max-width: 1100px; margin: 0 auto; padding: 1.5rem; }
    h1 { font-size: 1.6rem; font-weight: 800; letter-spacing: -.03em; }
    h2 { font-size: 1.05rem; margin: 0 0 .85rem; color: var(--accent); font-weight: 700; }
    .card { background: linear-gradient(180deg, var(--card), #151d2b); border-radius: var(--radius); padding: 1.25rem; margin-bottom: 1rem; border: 1px solid var(--border); animation: fadeUp .45s ease both; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    input, button, select { font: inherit; padding: .65rem .9rem; border-radius: 10px; border: 1px solid var(--border); background: #0f172a; color: var(--text); }
    button { background: linear-gradient(135deg, #0ea5e9, #2dd4bf); color: #0b1220; border: none; cursor: pointer; font-weight: 700; transition: filter .15s, transform .15s; }
    button:hover { filter: brightness(1.08); transform: translateY(-1px); }
    button.secondary { background: #334155; color: white; }
    .row { display: flex; gap: .75rem; flex-wrap: wrap; align-items: center; }
    .row > * { flex: 1; min-width: 140px; }
    table { width: 100%; border-collapse: collapse; font-size: .9rem; }
    th, td { text-align: left; padding: .65rem .4rem; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-weight: 600; }
    .muted { color: var(--muted); font-size: .85rem; }
    .badge { display: inline-block; padding: .15rem .5rem; border-radius: 999px; font-size: .75rem; font-weight: 700; }
    .badge.ok { background: #166534; color: var(--ok); }
    .badge.bad { background: #7f1d1d; color: var(--danger); }
    #login-view, #app-view { display: none; }
    #login-view.active, #app-view.active { display: block; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1rem; }
    .stat .num { font-size: 1.85rem; font-weight: 800; color: var(--accent); letter-spacing: -.03em; }
    pre { background: #0f172a; padding: .75rem; border-radius: 10px; overflow-x: auto; font-size: .85rem; border: 1px solid var(--border); }
    a { color: var(--accent); }
    .brand { display: flex; align-items: center; gap: .75rem; margin-bottom: .35rem; }
    .logo { width: 42px; height: 42px; border-radius: 12px; background: linear-gradient(135deg, #0ea5e9, #2dd4bf); display: grid; place-items: center; font-size: 1.2rem; box-shadow: 0 8px 20px #0ea5e944; }
    header { margin-bottom: 1.25rem; animation: fadeUp .4s ease both; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="brand">
        <div class="logo">🍽️</div>
        <div>
          <h1>Order Flow</h1>
          <p class="muted">Seller dashboard · customers, licenses & APK</p>
        </div>
      </div>
    </header>
    <div id="login-view" class="active">
      <div class="card" style="max-width: 400px; margin-top: 1.5rem;">
        <h2>Admin login</h2>
        <div class="row" style="flex-direction: column;">
          <input type="email" id="email" placeholder="Email" value="admin@example.com" />
          <input type="password" id="password" placeholder="Password" />
          <button onclick="login()">Login</button>
        </div>
        <p class="muted" style="margin-top: 1rem;">First login with your email creates the admin account.</p>
      </div>
    </div>
    <div id="app-view">
      <div class="row" style="justify-content: space-between; margin: 1rem 0; align-items: flex-start;">
        <div class="stats" id="stats" style="flex: 1;"></div>
        <button class="secondary" onclick="logout()" style="flex: 0;">Logout</button>
      </div>
      <div class="card"><h2>Latest APK</h2><div id="releases">Loading…</div>
        <p class="muted" style="margin-top:.5rem">Customer download: <a href="/api/v1/download/android">/api/v1/download/android</a></p>
      </div>
      <div class="card">
        <h2>Customers</h2>
        <div class="row" style="margin-bottom: 1rem;">
          <input id="cust-name" placeholder="Restaurant name" />
          <input id="cust-email" placeholder="Contact email" />
          <button onclick="createCustomer()">Add customer</button>
        </div>
        <div id="customers-list"></div>
      </div>
      <div class="card">
        <h2>Generate license</h2>
        <div class="row">
          <select id="lic-customer"></select>
          <input type="date" id="lic-expires" />
          <input type="number" id="lic-maxdev" value="20" placeholder="Max devices" />
          <button onclick="createLicense()">Generate key</button>
        </div>
        <div id="new-license" style="margin-top: 1rem;"></div>
      </div>
      <div class="card"><h2>All licenses</h2><div id="licenses-list"></div></div>
    </div>
  </div>
  <script>
    const API = window.location.origin;
    let token = localStorage.getItem('of_token');
    function headers() { return { 'Content-Type': 'application/json', ...(token ? { Authorization: 'Bearer ' + token } : {}) }; }
    async function api(path, opts = {}) {
      const res = await fetch(API + path, { ...opts, headers: { ...headers(), ...opts.headers } });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || res.statusText);
      return data;
    }
    function show(view) {
      document.getElementById('login-view').classList.toggle('active', view === 'login');
      document.getElementById('app-view').classList.toggle('active', view === 'app');
    }
    async function login() {
      try {
        const data = await api('/api/v1/admin/login', { method: 'POST', body: JSON.stringify({ email: document.getElementById('email').value, password: document.getElementById('password').value }) });
        token = data.token; localStorage.setItem('of_token', token); show('app'); await refresh();
      } catch (e) { alert(e.message); }
    }
    function logout() { token = null; localStorage.removeItem('of_token'); show('login'); }
    async function refresh() {
      try {
        const [stats, customers, licenses, releases] = await Promise.all([api('/api/v1/stats'), api('/api/v1/customers'), api('/api/v1/licenses'), api('/api/v1/releases/latest')]);
        document.getElementById('stats').innerHTML =
          `<div class="stat card"><div class="num">${stats.totalCustomers}</div><div class="muted">Customers</div></div>` +
          `<div class="stat card"><div class="num">${stats.activeLicenses}</div><div class="muted">Active licenses</div></div>` +
          `<div class="stat card"><div class="num">${stats.validationsToday}</div><div class="muted">Validations today</div></div>`;
        let custHtml = '<table><tr><th>Name</th><th>Email</th><th>Licenses</th><th>Created</th></tr>';
        const sel = document.getElementById('lic-customer'); sel.innerHTML = '';
        for (const c of customers.customers) {
          custHtml += `<tr><td>${c.name}</td><td>${c.contact_email || '—'}</td><td>${c.active_licenses}</td><td class="muted">${c.created_at}</td></tr>`;
          const opt = document.createElement('option'); opt.value = c.id; opt.textContent = c.name; sel.appendChild(opt);
        }
        document.getElementById('customers-list').innerHTML = custHtml + '</table>';
        let licHtml = '<table><tr><th>Key</th><th>Customer</th><th>Expires</th><th>Status</th><th></th></tr>';
        for (const l of licenses.licenses) {
          const active = l.is_active && new Date(l.expires_at) > new Date();
          licHtml += `<tr><td><code>${l.license_key}</code></td><td>${l.customer_name}</td><td>${l.expires_at.slice(0,10)}</td>` +
            `<td><span class="badge ${active ? 'ok' : 'bad'}">${active ? 'Active' : 'Inactive'}</span></td>` +
            `<td><button class="secondary" style="padding:0.3rem 0.6rem" onclick="toggleLicense('${l.id}', ${l.is_active ? 0 : 1})">${l.is_active ? 'Revoke' : 'Activate'}</button></td></tr>`;
        }
        document.getElementById('licenses-list').innerHTML = licHtml + '</table>';
        if (releases.tag) {
          let assets = (releases.assets || []).map(a => `<li><a href="${a.downloadUrl}" target="_blank">${a.name}</a></li>`).join('');
          document.getElementById('releases').innerHTML = `<p><strong>${releases.name || releases.tag}</strong></p><ul>${assets || '<li class="muted">No assets yet</li>'}</ul>`;
        } else {
          document.getElementById('releases').innerHTML = '<p class="muted">No GitHub releases found yet. Create a release with the APK.</p>';
        }
      } catch (e) { if (String(e.message).includes('Unauthorized')) logout(); else console.error(e); }
    }
    async function createCustomer() {
      const name = document.getElementById('cust-name').value.trim();
      if (!name) return alert('Name required');
      await api('/api/v1/customers', { method: 'POST', body: JSON.stringify({ name, contact_email: document.getElementById('cust-email').value.trim() || null }) });
      document.getElementById('cust-name').value = ''; document.getElementById('cust-email').value = '';
      await refresh();
    }
    async function createLicense() {
      const customerId = document.getElementById('lic-customer').value;
      const expires = document.getElementById('lic-expires').value;
      const maxDevices = parseInt(document.getElementById('lic-maxdev').value) || 20;
      if (!customerId || !expires) return alert('Select customer and expiry');
      const data = await api('/api/v1/licenses', { method: 'POST', body: JSON.stringify({ customerId, expiresAt: expires + 'T23:59:59Z', maxDevices }) });
      document.getElementById('new-license').innerHTML = `<p>New license key:</p><pre>${data.licenseKey}</pre><p class="muted">Give this key to the restaurant.</p>`;
      await refresh();
    }
    async function toggleLicense(id, isActive) {
      await api('/api/v1/licenses/' + id, { method: 'PUT', body: JSON.stringify({ is_active: !!isActive }) });
      await refresh();
    }
    if (token) { show('app'); refresh(); } else show('login');
    const d = new Date(); d.setDate(d.getDate() + 30);
    document.getElementById('lic-expires').value = d.toISOString().slice(0, 10);
  </script>
</body>
</html>
